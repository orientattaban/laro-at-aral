# Builds the game, runs every test, and publishes the web version to GitHub Pages
# each time something is pushed to the "main" branch.
# If any test fails, nothing is published.
name: Build, test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Unit tests and content rules
        run: npm test
      - name: Build and report the app size
        run: npm run build
      - name: Browser for the offline tests
        run: npx playwright install --with-deps chromium
      - name: Offline and no-network tests
        run: npm run test:offline
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
